name: 'gh PR Creator Action'
description: 'Action to open a PR between branches using the GitHub CLI'
author: 'rmottainfo'
inputs:
  title:
    description: 'PR Title'
    required: true
  body:
    description: 'PR Body'
    required: true
  source_branch:
    description: 'Source Branch'
    required: true
  dest_branch:
    description: 'Target Branch'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Run pr-creator.sh
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/pr-creator.sh
        ${{ github.action_path }}/pr-creator.sh \
          "${{ inputs.title }}" \
          "${{ inputs.body }}" \
          "${{ inputs.source_branch }}" \
          "${{ inputs.dest_branch }}"
